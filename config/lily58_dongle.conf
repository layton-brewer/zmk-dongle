# Config for the Lily58 dongle (the BLE central / USB host connection point).
#
# Uncomment lines below to enable optional features.

# Uncomment to make the dongle always prefer USB output over BLE when both
# are available (useful since the dongle is almost always plugged in via USB).
# CONFIG_ZMK_USB=y

# Uncomment if you want to use ZMK Studio with this dongle.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Improves BLE connection strength between the dongle and the two halves,
# at a negligible power cost. Worth enabling if you have pairing/range issues.
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Gaming fixes ---

# N-Key Rollover: by default ZMK only reports 6 simultaneous keypresses (HKRO).
# In games where you hold WASD + sprint + jump + crouch simultaneously you can
# easily exceed 6 keys, which causes the oldest held key to be silently dropped
# and then re-reported, creating a stutter or brief "stuck" effect.
# NKRO removes that limit entirely. Note: may not work in some BIOS/UEFI screens.
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Sends modifier (Shift/Ctrl/Alt) release events AFTER non-modifier release.
# Helps prevent ghost modifier inputs in games when releasing key combos quickly.
CONFIG_ZMK_HID_SEPARATE_MOD_RELEASE_REPORT=y
