# Shared config for both Lily58 halves (now peripherals to the dongle).
# A file without _left/_right suffix applies to both halves automatically.
#
# Key bindings are no longer set here — they live in
# config/lily58_dongle.keymap, since the dongle is the central that
# processes the keymap. This file is just for hardware/feature toggles.

# Uncomment to improve BLE connection strength between each half and the
# dongle, at a negligible power cost. Worth enabling if you have
# pairing/range issues.
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Uncomment to enable the on-board OLED display on each half (if your
# Lily58 PCBs have one wired up).
# CONFIG_ZMK_DISPLAY=y

# Deep sleep: puts each half into a low-power "off" state after a period
# of inactivity. Each half's timer is independent and based on its own
# keypresses, so both will sleep ~60 minutes after the last key press on
# that half. Waking up happens automatically on the next keypress (may
# take a couple seconds to reconnect). This does NOT affect the dongle.
#
# Gaming note: this was raised from 10 to 60 minutes to prevent the
# "stuck key" issue in games — when a half deep sleeps mid-game it drops
# its BLE connection to the dongle while a key may still be held, and the
# OS never receives the key-release event, causing the key to appear held
# indefinitely. If you still experience this during very long gaming
# sessions, raise this value further or set CONFIG_ZMK_SLEEP=n to disable
# sleep entirely (at the cost of battery life on the halves).
CONFIG_ZMK_SLEEP=y
# 60 minutes, in milliseconds (60 * 60 * 1000)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# Idle timeout: a lighter "idle" state (not full sleep) that fires after
# 30 seconds by default. Raised to 5 minutes to avoid any latency spikes
# during quiet gaming moments (e.g. standing still, reading a menu).
# 5 minutes, in milliseconds (5 * 60 * 1000)
CONFIG_ZMK_IDLE_TIMEOUT=300000
